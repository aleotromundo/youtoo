<!DOCTYPE html>
<html lang="es">
<head><meta charset="utf-8"><title>syntax-check</title></head>
<body>
<script>
(async function () {
  const post = (line) => { try { fetch('/report', { method: 'POST', body: line }); } catch (_) {} };
  for (const file of ['/modules/milkdrop-presets.js', '/modules/classic.js']) {
    try {
      const source = await (await fetch(file)).text();
      new Function(source);
      post('PARSE OK ' + file + ' bytes=' + source.length);
    } catch (error) {
      post('PARSE FAIL ' + file + ' :: ' + (error && error.message));
    }
  }
  post('PARSE END');
})();
</script>
</body>
</html>
