<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>selftest-pending</title>
<style>html,body{margin:0;background:#000}canvas{display:block;width:900px;height:500px}</style>
</head>
<body>
<canvas id="c" width="900" height="500"></canvas>
<script src="/vendor/butterchurn-2.6.7.min.js"></script>
<script src="/vendor/milkdrop-preset-converter-0.1.2.min.js"></script>
<script>
(async function () {
  const log = [];
  const report = (status) => {
    const line = status + ' ' + log.join(' | ');
    document.title = line;
    try { fetch('/report', { method: 'POST', body: line }); } catch (_) {}
  };
  try {
    report('START');
    const man = await (await fetch('/presets/manifest.json')).json();
    log.push('manifest=' + man.count); report('STEP manifest');
    const wanted = new URLSearchParams(location.search).get('id');
    const entry = (wanted && man.presets.find((item) => item.id === wanted)) || man.presets[0];
    const resp = await fetch(entry.file);
    const buf = new Uint8Array(await resp.arrayBuffer());
    let text = '';
    for (let i = 0; i < buf.length; i += 8192) text += String.fromCharCode.apply(null, buf.subarray(i, i + 8192));
    report('STEP milk'); log.push('milk=' + entry.id + ' ' + text.length + 'b rating=' + entry.rating + ' hlsl=' + entry.hlsl);

    const conv = window.milkdropPresetConverter;
    let preset = conv.convertPreset(text);
    log.push('ret=' + (preset && preset.constructor ? preset.constructor.name : typeof preset) + ' keys=' + (preset ? Object.keys(preset).length : -1));
    if (preset && typeof preset.then === 'function') preset = await preset;
    log.push('converted_keys=' + Object.keys(preset).length); report('STEP converted');

    const AC = window.AudioContext || window.webkitAudioContext;
    const ctx = new AC();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    const analyser = ctx.createAnalyser();
    analyser.fftSize = 1024;
    gain.gain.value = 0.02;
    osc.frequency.value = 110;
    osc.connect(gain); gain.connect(analyser); gain.connect(ctx.destination);
    osc.start();
    ctx.resume().catch(function () {});

    const BC = window.butterchurn.createVisualizer ? window.butterchurn : window.butterchurn.default;
    const canvas = document.getElementById('c');
    const viz = BC.createVisualizer(ctx, canvas, { width: 900, height: 500, pixelRatio: 1 });
    viz.connectAudio(analyser);
    viz.loadPreset(preset, 0); report('STEP visualizer');
    for (let i = 0; i < 60; i++) { viz.render(); await new Promise(r => setTimeout(r, 30)); }
    log.push('canvas=' + canvas.width + 'x' + canvas.height);

    // Muestra de píxeles: copia el canvas WebGL a un 2D en el mismo frame.
    viz.render();
    const probe = document.createElement('canvas');
    probe.width = 180; probe.height = 100;
    const pctx = probe.getContext('2d');
    pctx.drawImage(canvas, 0, 0, probe.width, probe.height);
    const px = pctx.getImageData(0, 0, probe.width, probe.height).data;
    const colors = new Set();
    let lit = 0;
    for (let i = 0; i < px.length; i += 4) {
      colors.add((px[i] >> 3) + ',' + (px[i + 1] >> 3) + ',' + (px[i + 2] >> 3));
      if (px[i] + px[i + 1] + px[i + 2] > 24) lit += 1;
    }
    log.push('colors=' + colors.size + ' lit=' + lit + '/' + (px.length / 4));
    report('OK');
  } catch (e) {
    log.push('err=' + (e && e.message));
    report('FAIL');
  }
})();
</script>
</body>
</html>
