<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nowarfy - Radio Ilimitada</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-black: #000000; --bg-dark: #121212; --bg-card: #181818; --text-white: #ffffff; --text-gray: #b3b3b3; --spotify-green: #1db954;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Circular', sans-serif; background-color: var(--bg-black); color: var(--text-white); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        .main-container { display: flex; flex: 1; overflow: hidden; }
        .sidebar { width: 240px; background-color: var(--bg-black); padding: 24px; display: flex; flex-direction: column; gap: 20px; }
        .logo { font-size: 1.8rem; font-weight: 800; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; color: white; }
        .logo i { color: var(--spotify-green); }
        .nav-links li { list-style: none; margin-bottom: 10px; cursor: pointer; padding: 10px; border-radius: 4px; color: var(--text-gray); font-weight: 700; display: flex; align-items: center; gap: 15px; transition: 0.3s; }
        .nav-links li:hover, .nav-links li.active { background-color: #282828; color: white; }
        .nav-links li.active i { color: var(--spotify-green); }
        
        .content-area { flex: 1; background: linear-gradient(180deg, #2c2c2c 0%, var(--bg-dark) 40%); overflow-y: auto; padding: 30px; position: relative; }
        
        .search-container { position: sticky; top: 0; z-index: 50; background: rgba(18,18,18,0.95); padding: 10px 0; margin-bottom: 20px; backdrop-filter: blur(10px); }
        .search-input { width: 100%; padding: 12px 20px; border-radius: 50px; border: none; background: #fff; color: #000; font-size: 1rem; outline: none; font-weight: bold; }
        .search-input:focus { transform: scale(1.02); transition: 0.2s; }

        .mood-selector { display: flex; gap: 15px; margin-bottom: 30px; flex-wrap: wrap; }
        .mood-btn { flex: 1; min-width: 120px; padding: 15px; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; color: black; transition: transform 0.2s; font-size: 0.9rem; }
        .mood-btn:hover { transform: scale(1.05); }
        .mood-energy { background: #ff4757; } .mood-relax { background: #2ed573; } .mood-party { background: #ffa502; } .mood-sad { background: #5352ed; } .mood-focus { background: #1e90ff; }

        .section-title { margin-top: 30px; margin-bottom: 15px; font-size: 1.5rem; font-weight: 700; display: flex; align-items: center; gap: 10px; }
        .section-title i { color: var(--spotify-green); font-size: 1rem; }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 24px; }

        .card { background-color: var(--bg-card); padding: 16px; border-radius: 8px; cursor: pointer; transition: 0.3s; position: relative; }
        .card:hover { background-color: #282828; transform: translateY(-5px); }
        .card-img { width: 100%; aspect-ratio: 16/9; object-fit: cover; border-radius: 4px; margin-bottom: 16px; background: #333; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .card-title { font-weight: 700; margin-bottom: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 0.9rem; }
        .card-desc { font-size: 0.8rem; color: var(--text-gray); }
        .play-btn { position: absolute; right: 20px; bottom: 85px; width: 48px; height: 48px; border-radius: 50%; background-color: var(--spotify-green); display: flex; align-items: center; justify-content: center; opacity: 0; transform: translateY(10px); transition: 0.3s; color: black; font-size: 1.2rem; box-shadow: 0 4px 10px rgba(0,0,0,0.4); }
        .card:hover .play-btn { opacity: 1; transform: translateY(0); }
        .card:hover .play-btn:hover { background-color: #1ed760; transform: scale(1.05); }

        .player-bar { height: 90px; background-color: #181818; border-top: 1px solid #282828; padding: 0 20px; display: flex; align-items: center; justify-content: space-between; z-index: 100; }
        .player-left { display: flex; align-items: center; width: 30%; }
        .player-img { width: 56px; height: 56px; margin-right: 15px; border-radius: 4px; display: none; background: #333; object-fit: cover; }
        .track-info { display: flex; flex-direction: column; justify-content: center; }
        .track-name { font-size: 0.9rem; font-weight: 700; margin-bottom: 3px; color: white; }
        .artist-name { font-size: 0.75rem; color: var(--text-gray); }
        .fav-btn { margin-left: 15px; color: var(--text-gray); cursor: pointer; font-size: 1.2rem; transition: 0.2s; }
        .fav-btn.active { color: var(--spotify-green); }
        
        .player-center { display: flex; flex-direction: column; align-items: center; width: 40%; }
        .controls { display: flex; align-items: center; gap: 20px; margin-bottom: 10px; }
        .btn-control { background: none; border: none; color: var(--text-gray); font-size: 1.1rem; cursor: pointer; }
        .btn-control:hover { color: white; }
        .btn-play { background: white; color: black; border-radius: 50%; width: 35px; height: 35px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 1rem; }
        .btn-play:hover { transform: scale(1.05); }

        .progress-bar { width: 100%; height: 4px; background: #535353; border-radius: 2px; cursor: pointer; position: relative; display: flex; align-items: center; gap: 10px; font-size: 0.7rem; color: var(--text-gray); }
        .progress-fill { height: 100%; background: var(--text-gray); border-radius: 2px; width: 0%; transition: width 0.2s linear; }
        .progress-bar:hover .progress-fill { background: var(--spotify-green); }

        #yt-player-container { display: none; }
        .loader { text-align: center; color: var(--text-gray); padding: 20px; display: none; }
    </style>
</head>
<body>

    <div class="main-container">
        <div class="sidebar">
            <div class="logo"><i class="fab fa-spotify"></i> Nowarfy <span style="font-size:0.5em; color:#666;">UNLIMITED</span></div>
            <ul class="nav-links">
                <li onclick="resetView()" class="active"><i class="fas fa-home"></i> Inicio</li>
                <li onclick="showSection('favorites')"><i class="fas fa-heart"></i> Favoritos <span id="favCount" style="margin-left:auto; font-size:0.8em;">0</span></li>
            </ul>
        </div>

        <div class="content-area">
            <div class="search-container">
                <input type="text" class="search-input" id="searchInput" placeholder="Busca cualquier cosa: Nirvana, Tool, Rock, Piano..." onkeyup="handleSearchDebounced()">
            </div>

            <div class="mood-selector">
                <button class="mood-btn mood-energy" onclick="setMood('energy')"> Energía</button>
                <button class="mood-btn mood-relax" onclick="setMood('relax')">☁️ Relax</button>
                <button class="mood-btn mood-party" onclick="setMood('party')">🍸 Fiesta</button>
                <button class="mood-btn mood-sad" onclick="setMood('sad')">Melancolía</button>
                <button class="mood-btn mood-focus" onclick="setMood('focus')"> Enfoque</button>
            </div>

            <div id="loader" class="loader"><i class="fas fa-circle-notch fa-spin"></i> Buscando en el universo...</div>
            <div id="dynamicSections"></div>
        </div>
    </div>

    <div class="player-bar">
        <div class="player-left">
            <img src="" class="player-img" id="currentImg">
            <div class="track-info">
                <div class="track-name" id="currTitle">Selecciona una canción</div>
                <div class="artist-name" id="currArtist">...</div>
            </div>
            <i class="far fa-heart fav-btn" id="favBtn" onclick="toggleFavorite()"></i>
        </div>
        <div class="player-center">
            <div class="controls">
                <button class="btn-control" onclick="prevSong()"><i class="fas fa-step-backward"></i></button>
                <button class="btn-play" onclick="togglePlay()" id="playBtn"><i class="fas fa-play"></i></button>
                <button class="btn-control" onclick="nextSong(true)"><i class="fas fa-step-forward"></i></button>
            </div>
            <div class="progress-bar">
                <span id="currTime">0:00</span>
                <div style="flex:1; height:4px; background:#535353; border-radius:2px; position:relative;">
                    <div class="progress-fill" id="progFill"></div>
                </div>
                <span id="totalTime">0:00</span>
            </div>
        </div>
        <div style="width:30%"></div>
    </div>

    <div id="yt-player-container"></div>
    <audio id="audio-element"></audio>

    <script>
        let currentList = [];
        let favorites = JSON.parse(localStorage.getItem('nowarfy_favs')) || [];
        let currentIndex = -1;
        let isPlaying = false;
        let searchQuery = "";
        let currentMood = null;
        let searchTimeout = null;
        let ytPlayer = null;
        let progressInterval = null;
        
        const audioEl = document.getElementById('audio-element');

        resetView();
        loadYouTubeAPI();

        // --- LÓGICA DE BÚSQUEDA HÍBRIDA (LLAMA AL BACKEND /api/search) ---
        function handleSearchDebounced() {
            clearTimeout(searchTimeout);
            const query = document.getElementById('searchInput').value.trim();
            if (!query) { resetView(); return; }
            searchTimeout = setTimeout(() => performSmartSearch(query), 600);
        }

        async function performSmartSearch(query) {
            searchQuery = query;
            currentMood = null;
            document.querySelectorAll('.mood-btn').forEach(b => b.classList.remove('active'));
            
            const loader = document.getElementById('loader');
            const container = document.getElementById('dynamicSections');
            loader.style.display = 'block';
            container.innerHTML = '';

            try {
                // Intentamos buscar en YouTube primero a través de nuestro backend
                await searchYouTube(query);
            } catch (e) {
                console.warn("YouTube falló o no hay clave, probando Openverse...", e);
                try {
                    await searchOpenverse(query);
                } catch (e2) {
                    container.innerHTML = '<p style="padding:20px; color:var(--alert)">Error de conexión. Verifica internet o claves en Vercel.</p>';
                }
            } finally {
                loader.style.display = 'none';
            }
        }

        async function searchYouTube(query) {
            // LLAMADA A NUESTRO BACKEND (/api/search) QUE TIENE LAS CLAVES DE VERCEL
            const response = await fetch(`/api/search?query=${encodeURIComponent(query)}&type=youtube`);
            
            if (!response.ok) throw new Error('Error en el servidor de búsqueda YouTube');
            
            const data = await response.json();

            if (data.items && data.items.length > 0) {
                const mappedResults = data.items.map(item => ({
                    title: item.snippet.title,
                    artist: item.snippet.channelTitle,
                    img: item.snippet.thumbnails.medium.url,
                    url: item.id.videoId, 
                    type: 'yt',
                    genre: 'unknown',
                    mood: 'unknown'
                }));
                currentList = mappedResults;
                renderGrid(mappedResults, `Resultados de YouTube: "${query}"`, "<i class='fab fa-youtube'></i>");
            } else {
                // Si YouTube no devuelve nada, lanzamos error para probar Openverse
                throw new Error("No results in YouTube");
            }
        }

        async function searchOpenverse(query) {
            // LLAMADA A NUESTRO BACKEND (/api/search) QUE TIENE LAS CLAVES DE VERCEL
            const response = await fetch(`/api/search?query=${encodeURIComponent(query)}&type=openverse`);
            
            if (!response.ok) throw new Error('Error en el servidor de búsqueda Openverse');

            const data = await response.json();

            if (data.results && data.results.length > 0) {
                const mappedResults = data.results.map(track => {
                    // Manejo seguro de géneros
                    let genre = 'unknown';
                    if (track.genres && track.genres.length > 0) {
                        genre = track.genres[0];
                    } else if (track.category) {
                        genre = track.category; 
                    }

                    return {
                        title: track.title || 'Sin título',
                        artist: track.creator || 'Desconocido',
                        img: track.thumbnail || 'https://via.placeholder.com/300x180?text=No+Cover',
                        url: track.url,
                        type: 'mp3',
                        genre: genre,
                        mood: 'unknown'
                    };
                });
                currentList = mappedResults;
                renderGrid(mappedResults, `Resultados Libres (Openverse): "${query}"`, "<i class='fas fa-globe'></i>");
            } else {
                throw new Error("No results in Openverse");
            }
        }

        function setMood(mood) {
            currentMood = mood;
            searchQuery = "";
            document.getElementById('searchInput').value = "";
            document.querySelectorAll('.mood-btn').forEach(b => b.classList.remove('active'));
            event.currentTarget.classList.add('active');
            performSmartSearch(mood); 
        }

        function resetView() {
            searchQuery = ""; currentMood = null;
            document.getElementById('searchInput').value = "";
            document.querySelectorAll('.mood-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.nav-links li').forEach(l => l.classList.remove('active'));
            document.querySelector('.nav-links li:first-child').classList.add('active');
            performSmartSearch("rock classics");
        }

        function showSection(section) {
            if(section === 'favorites') renderGrid(favorites, "Tus Favoritos", "<i class='fas fa-heart'></i>");
        }

        function renderGrid(list, title, icon) {
            if (!list || list.length === 0) return;
            const container = document.getElementById('dynamicSections');
            const section = document.createElement('div');
            section.innerHTML = `<div class="section-title">${icon} ${title}</div>`;
            const grid = document.createElement('div');
            grid.className = 'grid';

            list.forEach((song, idx) => {
                const div = document.createElement('div');
                div.className = 'card';
                div.innerHTML = `
                    <img src="${song.img}" class="card-img" loading="lazy">
                    <div class="play-btn"><i class="fas fa-play"></i></div>
                    <div class="card-title">${song.title}</div>
                    <div class="card-desc">${song.artist}</div>
                `;
                div.onclick = () => play(idx);
                grid.appendChild(div);
            });
            section.appendChild(grid);
            container.appendChild(section);
        }

        function loadYouTubeAPI() {
            if (window.YT && window.YT.Player) return;
            const tag = document.createElement('script');
            tag.src = "https://www.youtube.com/iframe_api";
            document.getElementsByTagName('script')[0].parentNode.insertBefore(tag, document.getElementsByTagName('script')[0]);
            window.onYouTubeIframeAPIReady = () => console.log("YT Engine Ready");
        }

        function play(idx) {
            currentIndex = idx;
            const song = currentList[idx];
            
            document.getElementById('currTitle').innerText = song.title;
            document.getElementById('currArtist').innerText = song.artist;
            const img = document.getElementById('currentImg');
            img.src = song.img;
            img.style.display = 'block';
            updateFavButton(song);

            stopAll();

            if (song.type === 'yt') {
                if (window.YT && window.YT.Player) initYTPlayer(song.url);
                else setTimeout(() => initYTPlayer(song.url), 500);
            } else {
                audioEl.src = song.url;
                audioEl.play().then(() => {
                    isPlaying = true; updateIcon(); startProgress(audioEl);
                }).catch(e => alert("Error al reproducir stream."));
                audioEl.ontimeupdate = () => updateProgress(audioEl.currentTime, audioEl.duration);
                audioEl.onended = () => nextSong();
            }
        }

        function initYTPlayer(videoId) {
            document.getElementById('yt-player-container').innerHTML = '<div id="yt-player"></div>';
            ytPlayer = new YT.Player('yt-player', {
                height: '0', width: '0', videoId: videoId,
                playerVars: { 'autoplay': 1, 'controls': 0, 'enablejsapi': 1, 'origin': window.location.origin },
                events: { 'onReady': onYTReady, 'onStateChange': onYTStateChange }
            });
        }

        function onYTReady() { isPlaying = true; updateIcon(); startProgress(ytPlayer); }
        function onYTStateChange(event) {
            if (event.data === YT.PlayerState.PLAYING) { isPlaying = true; if(!progressInterval) startProgress(ytPlayer); }
            else if (event.data === YT.PlayerState.PAUSED) isPlaying = false;
            else if (event.data === YT.PlayerState.ENDED) nextSong();
            updateIcon();
        }

        function togglePlay() {
            if(currentIndex === -1) return;
            const song = currentList[currentIndex];
            if (song.type === 'yt') {
                if(ytPlayer) { if(isPlaying) ytPlayer.pauseVideo(); else ytPlayer.playVideo(); isPlaying = !isPlaying; }
            } else {
                if(isPlaying) audioEl.pause(); else audioEl.play(); isPlaying = !isPlaying;
            }
            updateIcon();
        }

        function nextSong(manual = false) {
            let next = currentIndex + 1;
            if(next >= currentList.length) next = 0;
            play(next);
        }

        function prevSong() {
            let prev = currentIndex - 1;
            if(prev < 0) prev = currentList.length - 1;
            play(prev);
        }

        function stopAll() {
            if(ytPlayer) { ytPlayer.stopVideo(); ytPlayer.destroy(); ytPlayer = null; }
            audioEl.pause();
            if(progressInterval) clearInterval(progressInterval);
            isPlaying = false; updateIcon();
            document.getElementById('progFill').style.width = '0%';
        }

        function startProgress(source) {
            if(progressInterval) clearInterval(progressInterval);
            progressInterval = setInterval(() => {
                let curr, dur;
                if(source === ytPlayer) { curr = source.getCurrentTime(); dur = source.getDuration(); }
                else { curr = source.currentTime; dur = source.duration; }
                if(dur) {
                    document.getElementById('progFill').style.width = `${(curr/dur)*100}%`;
                    document.getElementById('currTime').innerText = format(curr);
                    document.getElementById('totalTime').innerText = format(dur);
                }
            }, 500);
        }

        function updateProgress(curr, dur) { /* Helper */ }
        function updateIcon() { document.getElementById('playBtn').innerHTML = isPlaying ? '<i class="fas fa-pause"></i>' : '<i class="fas fa-play"></i>'; }
        function format(sec) { if(!sec) return "0:00"; const m=Math.floor(sec/60); const s=Math.floor(sec%60); return `${m}:${s<10?'0'+s:s}`; }

        function toggleFavorite() {
            if(currentIndex === -1) return;
            const song = currentList[currentIndex];
            const idx = favorites.findIndex(f => f.title === song.title && f.artist === song.artist);
            if(idx >= 0) favorites.splice(idx, 1); else favorites.push(song);
            localStorage.setItem('nowarfy_favs', JSON.stringify(favorites));
            updateFavButton(song);
            document.getElementById('favCount').innerText = favorites.length;
        }
        function updateFavButton(song) {
            const exists = favorites.some(f => f.title === song.title && f.artist === song.artist);
            document.getElementById('favBtn').className = exists ? "fas fa-heart fav-btn active" : "far fa-heart fav-btn";
        }
    </script>
</body>
</html>
