<!DOCTYPE html><html><head><meta charset='utf-8'></head><body>
<script>
(async function(){
  const post=(l)=>{try{fetch('/report',{method:'POST',body:l});}catch(_){}};
  const src = await (await fetch('/modules/classic.js')).text();
  const lines = src.split('\n');
  // Binary search: find smallest prefix that fails
  let lo = 1, hi = lines.length;
  // First check if whole thing fails
  try { new Function(src); post('WHOLE OK'); return; } catch(e){}
  // Binary search on prefix length
  while (lo < hi) {
    const mid = Math.floor((lo+hi)/2);
    const chunk = lines.slice(0, mid).join('\n');
    try { new Function(chunk); lo = mid+1; }
    catch(e) { hi = mid; }
  }
  post('FIRSTFAILPREFIX at line ' + lo);
  post('LINE ' + lo + ' :: ' + (lines[lo-1]||'').slice(0,200));
  // Show surrounding
  for (let i = Math.max(0, lo-5); i < Math.min(lines.length, lo+4); i++) {
    post('CTX ' + (i+1) + ' :: ' + lines[i].slice(0,160));
  }
  post('END');
})();
</script></body></html>
